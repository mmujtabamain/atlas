[package]
name = "atlas-store"
description = "Atlas Financer persistence: a household in one SQLite file (one table per entity type), backups and a lock file. Keeps atlas-core free of I/O."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
atlas-core = { path = "../atlas-core" }
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
# Bundled SQLite: no system library needed on macOS or the Linux box.
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
