[package]
name = "atlas-store"
description = "Atlas Financer persistence: a household in one SQLite file (one table per entity type), backups and a lock file. Keeps atlas-core free of I/O."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
atlas-core = { path = "../atlas-core" }
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
sea-orm = { version = "1.1.20", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
include_dir = "0.7"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["rt", "sync"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
